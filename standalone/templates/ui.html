<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRAG UI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { margin-bottom: 20px; }
        button { padding: 10px 20px; margin: 5px; }
        #results { margin-top: 20px; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        .spinner {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px 0;
        }
        .spinner.active {
            display: block;
        }
        #ragForm {
            display: flex;
            gap: 10px;
            width: 100%;
            align-items: flex-start;
        }
        #ragQuery {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            resize: none;
            overflow: hidden;
            min-height: 50px;
            line-height: 1.5;
        }
        #ragForm button {
            padding: 12px 20px;
            cursor: pointer;
            align-self: flex-start;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>OpenRAG Standalone</h1>

    <h2>Upload PDFs</h2>
    <form id="uploadForm" enctype="multipart/form-data" style="display: flex; align-items: center; gap: 10px; max-width: 1000px;">
        <input type="file" name="files" multiple accept=".pdf" style="flex: 1;">
        <span id="uploadStatus" style="color: green; width: 200px; text-align: center;"></span>
        <button type="submit" style="width: 80px;">Upload</button>
        <span id="chunkCount" style="color: blue; width: 120px; text-align: center;"></span>
        <button type="button" id="resetBtn" style="width: 120px;">Reset Chroma DB</button>
    </form>

    <h2 style="display: flex; align-items: center; gap: 10px;">
        RAG Query
        <input type="number" id="ragTopK" placeholder="Top K" value="3" min="1" max="20" style="padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; width: 80px;">
    </h2>
    <form id="ragForm">
        <textarea id="ragQuery" placeholder="Enter your RAG query" required></textarea>
        <button type="submit">RAG</button>
    </form>

    <div id="results"></div>

    <script>
        // Function to update chunk count
        async function updateChunkCount() {
            try {
                const response = await fetch('/count_chunks');
                const result = await response.json();
                document.getElementById('chunkCount').textContent = `${result.count} chunks loaded`;
            } catch (e) {
                document.getElementById('chunkCount').textContent = 'Error loading count';
            }
        }

        // Auto-resize textarea
        const textarea = document.getElementById('ragQuery');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        // Handle Enter to submit, Shift+Enter for newline
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (e.shiftKey) {
                    // Shift+Enter: allow newline (default behavior)
                    return;
                } else {
                    // Enter: submit form
                    e.preventDefault();
                    document.getElementById('ragForm').dispatchEvent(new Event('submit'));
                }
            }
        });

        // Upload PDFs
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('uploadStatus').textContent = '';
            const formData = new FormData(e.target);
            const response = await fetch('/upload_pdfs', { method: 'POST', body: formData });
            const result = await response.json();
            document.getElementById('uploadStatus').textContent = `OK - ${result.chunks} chunks indexed from ${result.files} files.`;
            // Reset file input
            document.getElementById('uploadForm').querySelector('input[type="file"]').value = '';
            // Update chunk count
            updateChunkCount();
        });

        // RAG Query
        document.getElementById('ragForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('ragQuery').value;
            const top_k = document.getElementById('ragTopK').value;
            const results = document.getElementById('results');
            
            // Show spinner at the top
            const timestamp = new Date().toLocaleString();
            const logEntry = document.createElement('div');
            logEntry.innerHTML = `<h3>Query at ${timestamp}:</h3><div class="spinner active"></div>`;
            results.insertBefore(logEntry, results.firstChild);
            
            const response = await fetch('/rag', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, top_k: parseInt(top_k) })
            });
            const result = await response.json();
            result.answer = result.answer.replace(/\\n/g, '\n');
            logEntry.innerHTML = `
                <h3>Query at ${timestamp}:</h3>
                <pre>${result.answer}</pre>
                <hr>
            `;
        });

        // Reset Database
        document.getElementById('resetBtn').addEventListener('click', async () => {
            const response = await fetch('/reset', { method: 'DELETE' });
            const result = await response.json();
            document.getElementById('results').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
            // Update chunk count
            updateChunkCount();
        });

        // Initialize chunk count on page load
        updateChunkCount();
    </script>
</body>
</html>
