<!DOCTYPE html>
<html>
<head>
    <title>OpenRAG UI</title>
</head>
<body>

<h2>OpenRAG (Ollama)</h2>

<h3>Ask a question</h3>
<textarea id="query" rows="4" cols="60" placeholder="Ask something..."></textarea><br>
<button onclick="send()">Ask</button>

<h3>Upload PDFs</h3>
<input type="file" id="file" multiple accept=".pdf"/>
<button onclick="uploadPDF()">Upload PDF(s)</button>

<hr>
<pre id="result"></pre>

<script>
async function send() {
    const query = document.getElementById('query').value;

    const res = await fetch('/rag', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({query: query})
    });

    const data = await res.json();
    document.getElementById('result').textContent = JSON.stringify(data, null, 2);
}

async function uploadPDF() {
    const input = document.getElementById('file');

    if (!input.files.length) {
        alert('Select at least one PDF');
        return;
    }

    const formData = new FormData();

    for (const file of input.files) {
        if (file.name.toLowerCase().endsWith('.pdf')) {
            formData.append('files', file);
        }
    }

    document.getElementById('result').textContent = 
        `Uploading ${input.files.length} file(s)...`;

    const res = await fetch('/upload_pdfs', {
        method: 'POST',
        body: formData
    });

    const data = await res.json();
    document.getElementById('result').textContent = 
        JSON.stringify(data, null, 2);

    input.value = "";
}

//détecte shift+enter pour envoyer la requête
const textarea = document.getElementById('query');
textarea.addEventListener('keydown', function(event) {
    if (event.key === 'Enter' && event.shiftKey) {
        event.preventDefault();  // empêche le saut de ligne
        send();                  // envoie la requête
    }
});

</script>

</body>
</html>
