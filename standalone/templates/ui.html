<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRAG UI</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { margin-bottom: 20px; }
        button { padding: 10px 20px; margin: 5px; }
        #results { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>OpenRAG Standalone</h1>

    <h2>Upload PDFs</h2>
    <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" name="files" multiple accept=".pdf">
        <button type="submit">Upload</button>
    </form>

    <h2>RAG Query</h2>
    <form id="ragForm">
        <input type="text" id="ragQuery" placeholder="Enter your RAG query" required>
        <input type="number" id="ragTopK" placeholder="Top K" value="3">
        <button type="submit">RAG</button>
    </form>

    <h2>Reset Database</h2>
    <button id="resetBtn">Reset Chroma DB</button>

    <div id="results"></div>

    <script>
        // Upload PDFs
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const response = await fetch('/upload_pdfs', { method: 'POST', body: formData });
            const result = await response.json();
            document.getElementById('results').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        });

        // RAG Query
        document.getElementById('ragForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = document.getElementById('ragQuery').value;
            const top_k = document.getElementById('ragTopK').value;
            const response = await fetch('/rag', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, top_k: parseInt(top_k) })
            });
            const result = await response.json();
            document.getElementById('results').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        });

        // Reset Database
        document.getElementById('resetBtn').addEventListener('click', async () => {
            const response = await fetch('/reset', { method: 'DELETE' });
            const result = await response.json();
            document.getElementById('results').innerHTML = `<pre>${JSON.stringify(result, null, 2)}</pre>`;
        });
    </script>
</body>
</html>
